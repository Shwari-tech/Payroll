<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Secure Access | Petty Cash Ledger</title>

<!-- Preload critical assets for instant rendering -->
<link rel="preconnect" href="https://images.icon-icons.com">
<link rel="preconnect" href="https://images.rawpixel.com">
<link rel="preload" as="image" href="https://images.icon-icons.com/1156/PNG/512/1486565573-microsoft-office_81557.png">
<link rel="preload" as="image" href="https://images.rawpixel.com/image_png_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvdjkzNy1hZXctMTY1LnBuZw.png">

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    /* -- Ledger / vault palette -- */
    --paper:        #F6F7F5;   
    --paper-line:   #E4E7E2;
    --ink:          #101820;   
    --ink-soft:     #4B5560;
    --safe-green:   #1F6B45;   
    --safe-green-dk:#154C31;
    --field-rust:   #B5541A;   
    --field-rust-dk:#8C3F12;
    --brass:        #A5823C;   
    --brass-soft:   #C9AD73;

    --display: 'Fraunces', serif;
    --body:    'IBM Plex Sans', sans-serif;
    --mono:    'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    height:100dvh; width:100%;
    overflow:hidden;
    background:var(--paper);
    font-family:var(--body);
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ============================================================
     GROUND — ledger-paper texture, ambient animations
     ============================================================ */
  #bg-static{
    position:fixed; inset:0; z-index:1;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
  }
  #bg-static::before{
    content:''; position:absolute; top:0; bottom:0; left:15%; width:1px;
    background:rgba(181,84,26,0.14);
    animation: ruleGlow 6s ease-in-out infinite;
  }
  #bg-static::after{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(31,107,69,0.05) 0%, transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(181,84,26,0.05) 0%, transparent 45%);
  }
  @keyframes ruleGlow{
    0%, 100%{ opacity:1; }
    50%     { opacity:0.35; }
  }

  /* -- Drifting colour orbs -- */
  #bg-orbs{ position:fixed; inset:0; z-index:1; overflow:hidden; }
  #bg-orbs span{ position:absolute; border-radius:50%; filter:blur(60px); opacity:0.16; }
  #bg-orbs span:nth-child(1){ width:340px; height:340px; left:-90px; top:-70px; background:var(--safe-green); animation: orbDrift1 22s ease-in-out infinite; }
  #bg-orbs span:nth-child(2){ width:300px; height:300px; right:-80px; bottom:-60px; background:var(--field-rust); animation: orbDrift2 26s ease-in-out infinite; }
  #bg-orbs span:nth-child(3){ width:220px; height:220px; right:12%; top:8%; background:var(--brass); opacity:0.10; animation: orbDrift3 19s ease-in-out infinite; }
  
  @keyframes orbDrift1{ 0%,100%{ transform:translate(0,0) scale(1); } 50% { transform:translate(60px,40px) scale(1.15); } }
  @keyframes orbDrift2{ 0%,100%{ transform:translate(0,0) scale(1); } 50% { transform:translate(-50px,-35px) scale(1.1); } }
  @keyframes orbDrift3{ 0%,100%{ transform:translate(0,0) scale(1); } 50% { transform:translate(-30px,26px) scale(0.9); } }

  /* -- Slow diagonal light sweep -- */
  #bg-sweep{
    position:fixed; inset:-20%; z-index:1; pointer-events:none;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.9) 49%, rgba(255,255,255,0.9) 51%, transparent 60%);
    mix-blend-mode:screen; opacity:0.5;
    animation: sweep 9s ease-in-out infinite;
  }
  @keyframes sweep{ 0% { transform:translateX(-30%); } 50% { transform:translateX(30%); } 100% { transform:translateX(-30%); } }

  /* -- Floating ledger tally marks -- */
  #bg-particles{ position:fixed; inset:0; z-index:1; overflow:hidden; }
  #bg-particles svg{ position:absolute; opacity:0.22; animation: particleFloat 7s ease-in-out infinite; }
  #bg-particles svg:nth-child(1){ top:12%; left:8%;  width:26px; color:var(--safe-green); animation-delay:0s; }
  #bg-particles svg:nth-child(2){ top:22%; right:10%; width:20px; color:var(--field-rust); animation-delay:1.2s; }
  #bg-particles svg:nth-child(3){ bottom:16%; left:12%; width:22px; color:var(--brass); animation-delay:2.4s; }
  #bg-particles svg:nth-child(4){ bottom:24%; right:14%; width:18px; color:var(--safe-green); animation-delay:3.6s; }
  #bg-particles svg:nth-child(5){ top:48%; left:5%; width:16px; color:var(--field-rust); animation-delay:0.8s; }
  #bg-particles svg:nth-child(6){ top:56%; right:6%; width:24px; color:var(--brass); animation-delay:2s; }
  @keyframes particleFloat{ 0%, 100%{ transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-14px) rotate(6deg); } }

  /* ============================================================
     PICKER SCREEN
     ============================================================ */
  #picker-screen{
    position:fixed; inset:0; z-index:999;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:20px; box-sizing:border-box;
  }
  #picker-screen.hidden-instant{ display:none; }

  /* -- Seal mark -- */
  .picker-header{
    text-align:center; margin-bottom:36px; opacity:0;
    animation: rise 0.7s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }

  .seal{
    width:74px; height:74px; margin:0 auto 14px; position:relative;
    transform:scale(1.9) rotate(-14deg); opacity:0;
    animation: stamp 0.6s cubic-bezier(.2,.9,.25,1) 0.35s forwards;
  }
  .seal svg{ width:100%; height:100%; display:block; }
  .seal-ring{ stroke:var(--brass); stroke-width:1.4; fill:none; }
  .seal-ticks{ stroke:var(--brass-soft); stroke-width:1; }
  .seal-mark{ fill:var(--ink); }

  @keyframes stamp{
    0%   { transform:scale(1.9) rotate(-14deg); opacity:0; }
    55%  { transform:scale(0.94) rotate(2deg);  opacity:1; }
    75%  { transform:scale(1.05) rotate(-1deg); }
    100% { transform:scale(1) rotate(0deg);     opacity:1; }
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .brand-name{ color:var(--ink); font-family:var(--display); font-weight:600; font-size:1.22rem; letter-spacing:0.3px; margin-bottom:6px; }
  .brand-sub{ color:var(--ink-soft); font-size:0.78rem; font-weight:500; letter-spacing:0.2px; }

  /* -- Cards -- */
  .picker-grid{
    display:flex; gap:16px; width:100%; max-width:430px; opacity:0;
    animation: rise 0.7s cubic-bezier(.2,.8,.2,1) 0.5s forwards;
  }

  .picker-card{
    flex:1; background:#FFFFFF; border:1px solid var(--paper-line); border-radius:14px;
    padding:26px 14px 20px; display:flex; flex-direction:column; align-items:center;
    box-shadow:0 1px 2px rgba(16,24,32,0.04), 0 14px 28px -14px rgba(16,24,32,0.12);
    cursor:pointer; position:relative; text-align:center;
    transition:transform 0.18s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .picker-card:active{ transform:scale(0.96); }
  .picker-card:hover{
    transform:translateY(-3px);
    box-shadow:0 1px 2px rgba(16,24,32,0.05), 0 22px 34px -16px rgba(16,24,32,0.18);
  }
  .picker-card.office:hover{ border-color:rgba(31,107,69,0.35); }
  .picker-card.ground:hover{ border-color:rgba(181,84,26,0.35); }

  .picker-card::before{
    content:''; position:absolute; top:0; left:16px; right:16px; height:3px; border-radius:0 0 3px 3px;
  }
  .picker-card.office::before{ background:var(--safe-green); }
  .picker-card.ground::before{ background:var(--field-rust); }

  .picker-card::after{
    content:''; position:absolute; inset:0; border-radius:14px;
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%);
    transform:translateX(-120%); pointer-events:none;
  }
  .picker-card:hover::after{ animation: cardShine 0.9s ease forwards; }
  @keyframes cardShine{ to{ transform:translateX(120%); } }

  /* -- Icon shell & Images -- */
  .picker-icon-shell{
    position:relative; width:72px; height:72px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
  }

  .picker-icon-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px dashed;
    opacity: 0.6;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
  }
  .picker-card.office .picker-icon-ring { border-color: var(--safe-green); }
  .picker-card.ground .picker-icon-ring { border-color: var(--field-rust); }
  .picker-card:hover .picker-icon-ring { transform: rotate(48deg); }

  .picker-icon-wrap{
    position:relative; width:46px; height:46px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    z-index:2; overflow:hidden;
  }
  .picker-card.office .picker-icon-wrap{ background:#EEF5F0; }
  .picker-card.ground .picker-icon-wrap{ background:#FBEEE4; }
  
  .picker-icon-wrap img {
    width: 65%; height: 65%;
    object-fit: contain;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .picker-card:hover .picker-icon-wrap img { transform: scale(1.15); }

  .picker-badge{
    position:absolute; bottom:-2px; right:-2px;
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; z-index:3; border:2px solid #fff;
    font-size:10px;
  }
  .picker-card.office .picker-badge{ background:var(--safe-green); }
  .picker-card.ground .picker-badge{ background:var(--field-rust); }

  .picker-title{
    color:var(--ink); font-family:var(--display); font-weight:600;
    font-size:1rem; letter-spacing:0.2px; margin-bottom:5px; text-transform:uppercase;
  }
  .picker-desc{
    color:var(--ink-soft); font-size:0.74rem;
    font-weight:500; line-height:1.45;
  }

  /* -- Footer disclaimer -- */
  .disclaimer-box{
    position:absolute; bottom:26px;
    font-family:var(--mono); font-size:9.5px; color:var(--ink-soft);
    text-align:center; width:100%; line-height:1.6; letter-spacing:0.2px;
    opacity:0; animation: rise 0.7s ease 0.75s forwards;
  }
  .disclaimer-highlight{ color:var(--brass); font-weight:600; letter-spacing:0.8px; }

  /* ============================================================
     APP CONTAINER
     ============================================================ */
  .app-container{
    position:fixed; inset:0; z-index:10; opacity:0;
    pointer-events:none; -webkit-overflow-scrolling:touch;
  }
  .app-container.active{ opacity:1; pointer-events:all; }
  iframe{ width:100%; height:100%; border:none; background:#fff; }

</style>
</head>
<body>

  <div id="bg-static"></div>
  <div id="bg-orbs"><span></span><span></span><span></span></div>
  <div id="bg-sweep"></div>
  <div id="bg-particles">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 4v16M9 4v16M14 4v16M19 4v10l-4 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M9 12h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 4v16M9 4v16M14 4v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M12 9v6M9 12h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 4v16M9 4v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.4"/></svg>
  </div>

  <div id="picker-screen">

    <div class="picker-header">
      <div class="seal">
        <svg viewBox="0 0 64 64" fill="none">
          <circle class="seal-ring" cx="32" cy="32" r="29"/>
          <circle class="seal-ring" cx="32" cy="32" r="24"/>
          <g class="seal-ticks">
            <line x1="32" y1="4"  x2="32" y2="8"/>
            <line x1="32" y1="56" x2="32" y2="60"/>
            <line x1="4"  y1="32" x2="8"  y2="32"/>
            <line x1="56" y1="32" x2="60" y2="32"/>
          </g>
          <g class="seal-mark">
            <rect x="19" y="24" width="26" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="19" y1="31" x2="45" y2="31" stroke="currentColor" stroke-width="2"/>
            <circle cx="32" cy="31" r="2.6" fill="currentColor"/>
            <path d="M25 24 L25 20 Q25 17 28 17 L36 17 Q39 17 39 20 L39 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="brand-name">Cash Management</div>
      <div class="brand-sub">Select your access point</div>
    </div>

    <!-- YOUR EXACT REQUESTED GRID HTML STRUCTURE -->
    <div class="picker-grid">
      <div class="picker-card office" id="btn-office">
        <div class="picker-icon-shell">
          <div class="picker-icon-ring"></div>
          <div class="picker-icon-wrap">
            <img src="https://images.icon-icons.com/1156/PNG/512/1486565573-microsoft-office_81557.png" alt="Office" fetchpriority="high" decoding="async">
          </div>
          <div class="picker-badge"><i class="fas fa-lock"></i></div>
        </div>
        <div class="picker-title">Office</div>
        <div class="picker-desc">Head Office<br>Petty Cash Ledger</div>
      </div>

      <div class="picker-card ground" id="btn-ground">
        <div class="picker-icon-shell">
          <div class="picker-icon-ring"></div>
          <div class="picker-icon-wrap">
            <img src="https://images.rawpixel.com/image_png_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvdjkzNy1hZXctMTY1LnBuZw.png" alt="Ground" fetchpriority="high" decoding="async">
          </div>
          <div class="picker-badge"><i class="fas fa-lock"></i></div>
        </div>
        <div class="picker-title">Ground</div>
        <div class="picker-desc">Field Operations<br>Petty Cash Ledger</div>
      </div>
    </div>

    <div class="disclaimer-box">
      PROPERTY OF <span class="disclaimer-highlight">SHWARI MOVERS AND CLEANERS LTD</span><br>
      Finance Team · Cash Management · 2026
    </div>
  </div>

  <div class="app-container" id="app-wrapper">
    <iframe id="section-frame" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <script>
    // SECTION LINKS
    const SECTION_LINKS = {
        office: "https://script.google.com/macros/s/AKfycbxywoO96tuvySMFV8zcP0bU5ic6rsM8ALXhfjyPL4CVkH4g3CJqDAo62yR98BJzhxsukQ/exec",
        ground: "https://script.google.com/macros/s/AKfycbwzmV3rZ-QVIlCQXLug0QbAl_bNxReUNWpMuf-X6Ytu7ESiVvAa2uPy17UM0XnGiOsI/exec"
    };

    // INSTANT SELECT
    function openSection(key) {
        const frame = document.getElementById('section-frame');
        const picker = document.getElementById('picker-screen');
        const appWrapper = document.getElementById('app-wrapper');

        frame.src = SECTION_LINKS[key];
        picker.classList.add('hidden-instant');
        appWrapper.classList.add('active');
    }

    document.getElementById('btn-office').addEventListener('click', () => openSection('office'));
    document.getElementById('btn-ground').addEventListener('click', () => openSection('ground'));
  </script>
</body>
</html>
